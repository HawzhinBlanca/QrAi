# W2.18 canary stop alerts. Labels are closed process/route/state vocabularies only.
# Active privacy, isolation, chunk-integrity, and feedback-withholding probes feed the controller;
# they never become high-cardinality Prometheus labels.
groups:
  - name: qrai-http-canary
    rules:
      - alert: NodeCanaryDown
        expr: up{job="node-api"} == 0
        for: 1m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Node canary is unreachable"
          runbook: "docs/STAGING_RUNBOOK.md — immutable HTTP canary and reversal"

      - alert: JobWorkerDown
        expr: up{job="job-worker"} == 0
        for: 1m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Candidate durable worker is unreachable"

      - alert: NodeRealtimeShadowUnready
        expr: up{job="node-realtime"} == 0 or realtime_process_ready{job="node-realtime"} == 0
        for: 1m
        labels: { severity: warning, action: investigate }
        annotations:
          summary: "Node realtime shadow process is unreachable or unready"

      - alert: RustOracleDown
        expr: up{job="platform-api"} == 0
        for: 1m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Rust compatibility and reversal oracle is unreachable"

      - alert: NodeCanaryHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="node-api",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="node-api"}[5m])), 1) > 0.01
        for: 5m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Node canary 5xx rate exceeds 1%"

      - alert: NodeCanaryHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_ms_bucket{job="node-api"}[5m])) by (le)
          ) > 1000
        for: 5m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Node canary global p95 exceeds 1000ms"

      - alert: NodeCanaryFallbackShare
        expr: |
          sum(rate(http_requests_total{job="node-api",path="<unmatched>"}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="node-api"}[5m])), 1) > 0.05
        for: 5m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Rust compatibility fallback exceeds 5% of Node canary traffic"

      - alert: DurableJobBacklog
        expr: job_state{job="job-worker",status="queued"} > 100
        for: 5m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Candidate durable-job backlog exceeds 100"

      - alert: DurableJobRetries
        expr: job_state{job="job-worker",status="retry"} > 10
        for: 5m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Candidate durable-job retries exceed 10"

      - alert: DurableJobDeadLetter
        expr: job_state{job="job-worker",status="dead"} > 0
        for: 0m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Candidate produced a durable dead letter"

      - alert: StoredAudioUnindexed
        expr: realtime_gateway_chunks_stored_unindexed_total{job="realtime-gateway"} > 0
        for: 0m
        labels: { severity: page, action: stop-canary }
        annotations:
          summary: "Gateway stored audio that is not durably indexed"
