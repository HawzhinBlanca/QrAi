services:
  # === Database ===
  postgres:
    # unless-stopped: any crash (OOM, panic) self-heals instead of leaving the service down until
    # someone notices; survives host reboots but respects an explicit `docker compose stop` (P3.1).
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hawzhin
      POSTGRES_DB: quran_ai
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    ports:
      # Internal-only service: bind to loopback so it is reachable on the host (debugging, psql,
      # migrations) but NOT from other machines. Only platform-api (8080), the realtime gateway
      # (8081), and the web app are meant to be exposed off-host; postgres/worker/asr stay private.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawzhin -d quran_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot database boundary. This runs on both fresh and existing volumes; platform-api cannot
  # start until every checksum-locked migration and restricted-role grant succeeds.
  migrations:
    restart: "no"
    build:
      context: .
      dockerfile: server/migrations.Dockerfile
    environment:
      MIGRATION_DATABASE_URL: "postgresql://hawzhin:${POSTGRES_PASSWORD}@postgres:5432/quran_ai"
      APP_DATABASE_PASSWORD: "${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}"
      APP_DATABASE_ROLE: quran_ai_app
    command:
      - sh
      - -eu
      - -c
      - node server/scripts/migrate.mjs && node server/scripts/provision-role.mjs
    depends_on:
      postgres:
        condition: service_healthy

  # === Rust Platform API ===
  platform-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/platform-api/Dockerfile
    environment:
      DATABASE_URL: "postgresql://quran_ai_app:${APP_DATABASE_PASSWORD}@postgres:5432/quran_ai"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required in production}"
      REALTIME_GATEWAY_TICKET_SECRET: "${REALTIME_GATEWAY_TICKET_SECRET:?REALTIME_GATEWAY_TICKET_SECRET is required in production}"
      PLATFORM_API_BIND: "0.0.0.0:8080"
      ML_API_KEY: "${ML_API_KEY:?ML_API_KEY is required}"
      ASR_API_KEY: "${ASR_API_KEY:?ASR_API_KEY is required}"
      UPSTREAM_TIMEOUT_SECS: "${UPSTREAM_TIMEOUT_SECS:-60}"
      # DEPRECATED single switch — relaxes EVERY control below at once. Still honoured so existing
      # deploys keep working; platform-api warns loudly at boot and REFUSES to start if this is set
      # alongside any per-control variable. See specs/insecure-defaults-split/plan.md §3.
      ALLOW_INSECURE_DEFAULTS: "${ALLOW_INSECURE_DEFAULTS:-0}"
      # Per-control replacements. Empty = unset = strict, which is the production posture.
      ALLOW_INSECURE_SECRETS: "${ALLOW_INSECURE_SECRETS:-}"
      ALLOW_SUPERUSER_DB_ROLE: "${ALLOW_SUPERUSER_DB_ROLE:-}"
      METRICS_DEV_OPEN: "${METRICS_DEV_OPEN:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      # Exact web origin(s), comma-separated (e.g. https://app.example.org). REQUIRED in production
      # (ALLOW_INSECURE_SECRETS unset): platform-api fails closed on boot if this is empty, so the
      # pilot Origin allowlist (auth::require_allowed_origin) and browser CORS are ENFORCED, not
      # permissive. Empty default keeps local/staging (ALLOW_INSECURE_SECRETS=1) working unchanged.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      # Kill-switch: set MAINTENANCE_MODE=1 (then `docker compose up -d platform-api`) to gracefully
      # take the pilot down — every route except /health, /ready, /metrics returns 503, so healthchecks
      # and monitoring still see the process up-in-maintenance rather than crashed. Default off.
      MAINTENANCE_MODE: "${MAINTENANCE_MODE:-0}"
      ML_INFERENCE_URL: "http://job-worker:8098"
      ASR_INFERENCE_URL: "http://asr-inference:8091"
      # Operational knobs (safe defaults; override per deployment via .env.production):
      # DB pool ceiling for a classroom burst, acquire timeout before a retryable 503, and
      # LOG_FORMAT=json for a log aggregator. Empty LOG_FORMAT keeps the human-readable formatter.
      DATABASE_MAX_CONNECTIONS: "${DATABASE_MAX_CONNECTIONS:-10}"
      DATABASE_ACQUIRE_TIMEOUT_SECS: "${DATABASE_ACQUIRE_TIMEOUT_SECS:-10}"
      LOG_FORMAT: "${LOG_FORMAT:-}"
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      job-worker:
        condition: service_healthy
    healthcheck:
      # /ready (not /health) so the container is marked unhealthy when Postgres is unreachable —
      # readiness = "can actually serve", liveness /health only means "process up" (P3.6).
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  # === Node API shadow ===
  # Internal observation target only: no host port, no Web/gateway dependency, and Rust remains the
  # compatibility upstream. W2.4 moves modules into the server package before any traffic cutover.
  node-api:
    restart: unless-stopped
    image: "qrai/node-backend:${NODE_BACKEND_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: "postgresql://quran_ai_app:${APP_DATABASE_PASSWORD}@postgres:5432/quran_ai"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required in production}"
      REALTIME_GATEWAY_TICKET_SECRET: "${REALTIME_GATEWAY_TICKET_SECRET:?REALTIME_GATEWAY_TICKET_SECRET is required in production}"
      ML_API_KEY: "${ML_API_KEY:?ML_API_KEY is required}"
      ASR_API_KEY: "${ASR_API_KEY:?ASR_API_KEY is required}"
      UPSTREAM_TIMEOUT_SECS: "${UPSTREAM_TIMEOUT_SECS:-60}"
      SHUTDOWN_GRACE_SECS: "${SHUTDOWN_GRACE_SECS:-8}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      MAINTENANCE_MODE: "${MAINTENANCE_MODE:-0}"
      DEVICE_IDENTITY_ENABLED: "${DEVICE_IDENTITY_ENABLED:-0}"
      DISABLE_RATE_LIMIT: "${DISABLE_RATE_LIMIT:-0}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-0}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-}"
      ALLOW_INSECURE_DEFAULTS: "${ALLOW_INSECURE_DEFAULTS:-0}"
      ALLOW_INSECURE_SECRETS: "${ALLOW_INSECURE_SECRETS:-}"
      METRICS_DEV_OPEN: "${METRICS_DEV_OPEN:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      NODE_API_BIND: "0.0.0.0:8082"
      NODE_API_ROUTE_MODE: "explicit-compatibility"
      NODE_API_PORTED: "${NODE_API_PORTED:-GET /health,GET /ready}"
      NODE_HEALTHCHECK_URL: "http://127.0.0.1:8082/ready"
      PLATFORM_API_UPSTREAM: "http://platform-api:8080"
      ML_INFERENCE_URL: "http://job-worker:8098"
      ASR_INFERENCE_URL: "http://asr-inference:8091"
      # Local Compose deliberately shares the filesystem adapter between the Node roles. Production
      # sets AUDIO_STORAGE_DRIVER=s3 and the S3 variables below; a production-built process refuses
      # filesystem unless this conspicuous development-only acknowledgement is present.
      AUDIO_STORAGE_DRIVER: "${AUDIO_STORAGE_DRIVER:-filesystem}"
      AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY: "${AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY:-1}"
      AUDIO_STORAGE_DIR: "/data/audio-storage"
      AUDIO_STORAGE_S3_BUCKET: "${AUDIO_STORAGE_S3_BUCKET:-}"
      AUDIO_STORAGE_S3_REGION: "${AUDIO_STORAGE_S3_REGION:-}"
      AUDIO_STORAGE_S3_ENDPOINT: "${AUDIO_STORAGE_S3_ENDPOINT:-}"
      AUDIO_STORAGE_S3_FORCE_PATH_STYLE: "${AUDIO_STORAGE_S3_FORCE_PATH_STYLE:-}"
      AUDIO_STORAGE_S3_EXPECTED_OWNER: "${AUDIO_STORAGE_S3_EXPECTED_OWNER:-}"
      AUDIO_STORAGE_S3_ENCRYPTION: "${AUDIO_STORAGE_S3_ENCRYPTION:-AES256}"
      AUDIO_STORAGE_S3_KMS_KEY_ID: "${AUDIO_STORAGE_S3_KMS_KEY_ID:-}"
    volumes:
      - audio_storage:/data/audio-storage
    expose:
      - "8082"
    depends_on:
      platform-api:
        condition: service_healthy
      job-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "server/src/container-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Must remain greater than SHUTDOWN_GRACE_SECS so application cleanup, logs, and exit finish
    # before the container runtime escalates SIGTERM to SIGKILL.
    stop_grace_period: "${NODE_API_STOP_GRACE_PERIOD:-10s}"

  # Same package and production image as node-api; a separate command rescues durable work after an
  # API process crash. It has no public port and never receives a privileged database role.
  job-worker:
    restart: unless-stopped
    image: "qrai/node-backend:${NODE_BACKEND_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "server/src/worker.mjs"]
    environment:
      DATABASE_URL: "postgresql://quran_ai_app:${APP_DATABASE_PASSWORD}@postgres:5432/quran_ai"
      ML_API_KEY: "${ML_API_KEY:?ML_API_KEY is required}"
      ASR_API_KEY: "${ASR_API_KEY:?ASR_API_KEY is required}"
      ASR_SERVICE_URL: "http://asr-inference:8091"
      UPSTREAM_TIMEOUT_SECS: "${UPSTREAM_TIMEOUT_SECS:-60}"
      SHUTDOWN_GRACE_SECS: "${JOB_WORKER_SHUTDOWN_GRACE_SECS:-8}"
      JOB_WORKER_BIND: "0.0.0.0:8098"
      JOB_POLL_INTERVAL_MS: "${JOB_POLL_INTERVAL_MS:-1000}"
      JOB_OPERATION_TIMEOUT_SECS: "${JOB_OPERATION_TIMEOUT_SECS:-60}"
      JOB_LEASE_SECS: "${JOB_LEASE_SECS:-65}"
      JOB_RETRY_BASE_MS: "${JOB_RETRY_BASE_MS:-1000}"
      JOB_RETRY_MAX_MS: "${JOB_RETRY_MAX_MS:-300000}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      METRICS_DEV_OPEN: "${METRICS_DEV_OPEN:-}"
      NODE_HEALTHCHECK_URL: "http://127.0.0.1:8098/ready"
      AUDIO_STORAGE_DRIVER: "${AUDIO_STORAGE_DRIVER:-filesystem}"
      AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY: "${AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY:-1}"
      AUDIO_STORAGE_DIR: "/data/audio-storage"
      AUDIO_STORAGE_S3_BUCKET: "${AUDIO_STORAGE_S3_BUCKET:-}"
      AUDIO_STORAGE_S3_REGION: "${AUDIO_STORAGE_S3_REGION:-}"
      AUDIO_STORAGE_S3_ENDPOINT: "${AUDIO_STORAGE_S3_ENDPOINT:-}"
      AUDIO_STORAGE_S3_FORCE_PATH_STYLE: "${AUDIO_STORAGE_S3_FORCE_PATH_STYLE:-}"
      AUDIO_STORAGE_S3_EXPECTED_OWNER: "${AUDIO_STORAGE_S3_EXPECTED_OWNER:-}"
      AUDIO_STORAGE_S3_ENCRYPTION: "${AUDIO_STORAGE_S3_ENCRYPTION:-AES256}"
      AUDIO_STORAGE_S3_KMS_KEY_ID: "${AUDIO_STORAGE_S3_KMS_KEY_ID:-}"
    volumes:
      - audio_storage:/data/audio-storage
    expose:
      - "8098"
    depends_on:
      migrations:
        condition: service_completed_successfully
      asr-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "server/src/container-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: "${JOB_WORKER_STOP_GRACE_PERIOD:-10s}"

  # Same package and immutable image, isolated event loop. W3.2 is observation-only: this process
  # exposes health/readiness/metrics but no WebSocket upgrade, host port, or traffic dependency.
  node-realtime:
    restart: unless-stopped
    image: "qrai/node-backend:${NODE_BACKEND_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "server/src/realtime/main.mjs"]
    environment:
      DATABASE_URL: "postgresql://quran_ai_app:${APP_DATABASE_PASSWORD}@postgres:5432/quran_ai"
      SHUTDOWN_GRACE_SECS: "${NODE_REALTIME_SHUTDOWN_GRACE_SECS:-8}"
      NODE_REALTIME_BIND: "0.0.0.0:8081"
      NODE_HEALTHCHECK_URL: "http://127.0.0.1:8081/ready"
      REALTIME_READINESS_TIMEOUT_MS: "${REALTIME_READINESS_TIMEOUT_MS:-2000}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      METRICS_DEV_OPEN: "${METRICS_DEV_OPEN:-}"
      ML_INFERENCE_URL: "http://job-worker:8098"
      ASR_SERVICE_URL: "http://asr-inference:8091"
      AUDIO_STORAGE_DRIVER: "${AUDIO_STORAGE_DRIVER:-filesystem}"
      AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY: "${AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY:-1}"
      AUDIO_STORAGE_DIR: "/data/audio-storage"
      AUDIO_STORAGE_S3_BUCKET: "${AUDIO_STORAGE_S3_BUCKET:-}"
      AUDIO_STORAGE_S3_REGION: "${AUDIO_STORAGE_S3_REGION:-}"
      AUDIO_STORAGE_S3_ENDPOINT: "${AUDIO_STORAGE_S3_ENDPOINT:-}"
      AUDIO_STORAGE_S3_FORCE_PATH_STYLE: "${AUDIO_STORAGE_S3_FORCE_PATH_STYLE:-}"
      AUDIO_STORAGE_S3_EXPECTED_OWNER: "${AUDIO_STORAGE_S3_EXPECTED_OWNER:-}"
      AUDIO_STORAGE_S3_ENCRYPTION: "${AUDIO_STORAGE_S3_ENCRYPTION:-AES256}"
      AUDIO_STORAGE_S3_KMS_KEY_ID: "${AUDIO_STORAGE_S3_KMS_KEY_ID:-}"
    volumes:
      - audio_storage:/data/audio-storage
    expose:
      - "8081"
    depends_on:
      migrations:
        condition: service_completed_successfully
      job-worker:
        condition: service_healthy
      asr-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "server/src/container-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: "${NODE_REALTIME_STOP_GRACE_PERIOD:-10s}"

  # === Rust Realtime Gateway ===
  realtime-gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/realtime-gateway/Dockerfile
    environment:
      REALTIME_GATEWAY_BIND: "0.0.0.0:8081"
      REALTIME_GATEWAY_TICKET_SECRET: "${REALTIME_GATEWAY_TICKET_SECRET:?REALTIME_GATEWAY_TICKET_SECRET is required in production}"
      ML_INFERENCE_URL: "http://job-worker:8098"
      PLATFORM_API_URL: "http://platform-api:8080"
      GATEWAY_TENANT_ID: "hikmah-pilot-erbil"
      ML_API_KEY: "${ML_API_KEY:?ML_API_KEY is required}"
      # DEPRECATED — see the platform-api block. On this service it ALSO disables the entire CSWSH
      # Origin allowlist. A native/Flutter client needs GATEWAY_ALLOW_MISSING_ORIGIN=1 instead,
      # which accepts an upgrade with no Origin header while STILL rejecting a disallowed one.
      ALLOW_INSECURE_DEFAULTS: "${ALLOW_INSECURE_DEFAULTS:-0}"
      ALLOW_INSECURE_SECRETS: "${ALLOW_INSECURE_SECRETS:-}"
      METRICS_DEV_OPEN: "${METRICS_DEV_OPEN:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      GATEWAY_ALLOW_MISSING_ORIGIN: "${GATEWAY_ALLOW_MISSING_ORIGIN:-}"
      ALLOW_CHAOS_INJECTION: "${ALLOW_CHAOS_INJECTION:-}"
      # The gateway needs the allowlist too — it 403s every upgrade when this is unset in strict mode.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    ports:
      - "8081:8081"
    depends_on:
      platform-api:
        condition: service_healthy
      job-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Explicit recovery operation, never part of normal startup. Storage sidecars nominate candidates;
  # tenant-scoped session rows independently prove tenant + learner ownership before any index write.
  # Run: docker compose --profile operations run --rm audio-index-repair
  audio-index-repair:
    profiles: ["operations"]
    restart: "no"
    build:
      context: .
      dockerfile: server/migrations.Dockerfile
    environment:
      DATABASE_URL: "postgresql://quran_ai_app:${APP_DATABASE_PASSWORD}@postgres:5432/quran_ai"
      AUDIO_STORAGE_DRIVER: "${AUDIO_STORAGE_DRIVER:-filesystem}"
      AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY: "${AUDIO_STORAGE_FILESYSTEM_ACKNOWLEDGED_DEV_ONLY:-1}"
      AUDIO_STORAGE_DIR: "/data/audio-storage"
      AUDIO_STORAGE_S3_BUCKET: "${AUDIO_STORAGE_S3_BUCKET:-}"
      AUDIO_STORAGE_S3_REGION: "${AUDIO_STORAGE_S3_REGION:-}"
      AUDIO_STORAGE_S3_ENDPOINT: "${AUDIO_STORAGE_S3_ENDPOINT:-}"
      AUDIO_STORAGE_S3_FORCE_PATH_STYLE: "${AUDIO_STORAGE_S3_FORCE_PATH_STYLE:-}"
      AUDIO_STORAGE_S3_EXPECTED_OWNER: "${AUDIO_STORAGE_S3_EXPECTED_OWNER:-}"
      AUDIO_STORAGE_S3_ENCRYPTION: "${AUDIO_STORAGE_S3_ENCRYPTION:-AES256}"
      AUDIO_STORAGE_S3_KMS_KEY_ID: "${AUDIO_STORAGE_S3_KMS_KEY_ID:-}"
      AUDIO_RECONCILE_TENANT_IDS: "${AUDIO_RECONCILE_TENANT_IDS:-hikmah-pilot-erbil}"
    command: ["node", "server/scripts/repair-audio-index.mjs", "--apply"]
    volumes:
      - audio_storage:/data/audio-storage:ro
    depends_on:
      migrations:
        condition: service_completed_successfully

  # === ASR Inference (Python/Whisper) ===
  asr-inference:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/asr-inference/Dockerfile
    environment:
      ASR_HOST: "0.0.0.0"
      ASR_PORT: "8091"
      # NOTE: this pins the service to generic openai-whisper "base", NOT the specialized
      # Quran-fine-tuned model (tarteel-ai/whisper-base-ar-quran) that server.py defaults to and
      # that pyproject.toml's own description names as the primary model ("Quranic Arabic ASR
      # service (tarteel-ai/whisper-base-ar-quran via transformers, Whisper fallback)"). The
      # Dockerfile only installs fastapi/uvicorn/openai-whisper/torchaudio/soundfile — never
      # `transformers` — and pre-warms `whisper.load_model('base')`, not the HF model, so this
      # override is required for the image to boot un-degraded as currently built; without it,
      # `_load_model()` hits `ModuleNotFoundError: No module named 'transformers'` and every
      # transcribe/align/tajweed request 503s (verified empirically). Switching to the
      # specialized model is a real product/accuracy decision (recitation-tuned vs. generic
      # transcription) with real costs (transformers as a new prod dependency with historical
      # reachability caveats documented in ADR-0009, a larger image, and an HF model download during
      # build), so it isn't flipped here without an explicit call.
      ASR_MODEL: "base"
      # Exact SHA-256 embedded in openai-whisper's verified base.pt URL. Readiness independently
      # resolves that URL digest and refuses traffic when this selected-artifact pin disagrees.
      ASR_MODEL_DIGEST: "sha256:ed3a0b6b1c0edf879ad9b11b1af5a0e6ab5db9205f891f668f8b0e6c6326e34e"
      # This is the exact runnable baseline in model-candidates.json. It is intentionally not a
      # reviewed winner: no approved, consented Kurdish held-out benchmark exists yet.
      ASR_CANDIDATE_ID: "openai-whisper-base"
      ASR_API_KEY: "${ASR_API_KEY:?ASR_API_KEY is required}"
    ports:
      # Internal-only: loopback bind. Reached only server-side via the platform-api ASR proxy
      # (server-side x-asr-api-key) and the job worker. Not exposed off-host.
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # === Web Frontend ===
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Vite inlines VITE_* at BUILD time. These were previously under `environment:` — runtime env
      # on an nginx container serving a pre-built bundle, i.e. inert: the image ignored them and
      # used the code defaults. Declared here as build args so what is written is what ships.
      #
      # Values chosen to MATCH the behaviour that was actually shipping, not the inert declarations:
      #   - API "" -> relative /v1/, proxied by nginx on this origin (the old "http://localhost:8080"
      #     never took effect; baking it would newly bypass the proxy and need CORS).
      #   - gateway ws://localhost:8081 -> the direct port this stack publishes.
      args:
        VITE_PLATFORM_API_URL: ""
        VITE_REALTIME_GATEWAY_URL: "ws://localhost:8081"
    ports:
      - "5173:8080"
    environment:
      # The image entrypoint accepts only this Rust target or the explicit Node canary target.
      WEB_PLATFORM_API_UPSTREAM: "platform-api:8080"
    depends_on:
      platform-api:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
    healthcheck:
      # nginx-unprivileged:alpine does not include curl (only the four backend service images do)
      # — wget is available in Alpine by default.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  audio_storage:
