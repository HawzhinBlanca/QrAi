name: qrai
description: QrAi Quran learning client for iOS and Android.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The only three runtime dependencies, and each earns its place:
  #   http                   — dart:io's HttpClient does not exist on web, and the app targets
  #                            Chrome as well as iOS/Android.
  #   flutter_secure_storage — Keychain (iOS) / EncryptedSharedPreferences (Android). This is the
  #                            FL3 requirement; there is no stdlib equivalent.
  #   intl                   — ARB/plural handling for flutter_localizations. Comes with gen-l10n.
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  intl: any
  record: ^7.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
