name: ci
on:
  pull_request:
  push: { branches: [main] }

jobs:
  # The Android client, compiled. A separate job because it shares nothing with `verify` — no
  # Postgres, no Rust, no pnpm — so serialising them would add ~4 minutes to a gate that already
  # takes a while.
  #
  # `verify` runs `flutter test`, which is a different claim: those are widget tests against a stub
  # renderer and they pass on a project that cannot produce an APK at all. Until this job existed,
  # nothing anywhere proved the app compiles for a phone. It was first built by hand on 2026-08-02,
  # 52 minutes cold, 56 seconds warm.
  # The Node version package.json actually promises to support, which no other job runs.
  #
  # `verify` pins `node-version: "22"`, which resolves to the NEWEST 22 — the same floating-version
  # hazard the Flutter pin below calls out. It hid a real break: Node turns type stripping on by
  # default from 22.18, so `tests/contract/tajweed-gate-parity.test.mjs` (which imports a `.ts`
  # module to execute the real learner gate) passed on CI and threw ERR_UNKNOWN_FILE_EXTENSION on
  # 22.13. The gate was red on a supported runtime and green on the only runtime that tested it.
  #
  # Scoped to the Node suites deliberately: this is about the JS runtime, and duplicating the Rust,
  # Postgres and Flutter toolchains to learn nothing new would buy a doubled CI bill.
  node-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        # Exact, not a range: the point of this job is one specific runtime, the declared floor.
        with: { node-version: "22.13.1", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # The Muaalem evidence gate derives two byte-pinned PCM vectors. Hosted-runner contents are
      # not a contract, so provision the executable instead of skipping evidence when an image
      # revision removes it.
      - name: Install acoustic fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      # The same file list verify.sh runs, read FROM verify.sh rather than copied — a second copy
      # would drift and this job would quietly stop covering the newest tests.
      - name: Node services suite on the minimum supported runtime
        run: |
          files=$(python3 -c "
          import pathlib, re
          src = pathlib.Path('scripts/verify.sh').read_text()
          for line in src.split('\n'):
              if '--test scripts/fixture-normalize' in line:
                  print(' '.join(re.findall(r'[\w./-]+\.test\.mjs', line))); break
          ")
          test -n "$files" || { echo "could not read the test list out of verify.sh"; exit 1; }
          echo "$files" | tr ' ' '\n' | wc -l
          node --experimental-strip-types --test $files

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # --release, not --debug. A debug APK JITs a kernel snapshot; only the release path runs the
      # Dart AOT compiler, which is where tree-shaking and const-evaluation failures surface — the
      # class of break that is invisible in `flutter test` and in a debug build.
      - name: Build release APK
        working-directory: apps/flutter
        run: flutter build apk --release

      # "Built app-release.apk" is printed whether or not the AOT compiler actually ran, so the
      # artifact is inspected rather than trusted. Deliberately WITHOUT --require-release: CI holds
      # no keystore, so this build is debug-signed and not distributable, and the check reports that
      # instead of failing on it. See docs/RELEASE_SIGNING.md.
      - name: The artifact is what it claims to be
        run: node scripts/check-apk.mjs apps/flutter/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hawzhin
          POSTGRES_DB: quran_ai
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hawzhin -d quran_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://hawzhin@localhost:5432/quran_ai"
      ALLOW_INSECURE_DEFAULTS: "1"

    steps:
      - uses: actions/checkout@v4

      # --- Toolchains ---
      - uses: pnpm/action-setup@v4          # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      # MIG5: verify.sh runs the asr-inference plain-interpreter suites (eval metrics + the Arabic
      # diacritic regression from PR #258). numpy only — no torch, no model download.
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet "numpy>=2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/realtime-gateway
            services/platform-api
      # `verify.sh` SKIPS `dart analyze` and `flutter test` when the SDK is absent, and it says so
      # loudly — but a skip on CI is not a pass. Every Dart fix merged before this step existed was
      # proven only on the machine that wrote it. Installing the SDK here is what turns those into
      # gate-enforced claims.
      #
      # Pinned to the version `apps/flutter/pubspec.yaml` requires, so CI and a developer's machine
      # agree. A floating `stable` would let a Flutter release change the meaning of a green run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # --- Bootstrap ---
      - run: pnpm install --frozen-lockfile
      # `verify.sh` executes the same byte-pinned Muaalem vector derivation as node-min.
      - name: Install acoustic fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      # --- One migration/provision boundary; manifest membership and checksums are runner-enforced. ---
      - name: Migrate and provision restricted database role
        env:
          MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
          APP_DATABASE_PASSWORD: ci-dummy-password-long-enough
        run: |
          node server/scripts/migrate.mjs
          node server/scripts/provision-role.mjs

      # --- Seed the full Quran (canonical_ayahs/words for all 114 surahs) so integration
      #     tests like gets_quran_surah_list_from_postgres (expects >= 114) hold in CI. The
      #     migrations above seed only surah NAMES (0007) + Al-Fatihah ayahs (0002). Uses the
      #     psql-based seed (no `pg` dep); its defaults (localhost/hawzhin/quran_ai) match the
      #     postgres service, only PSQL needs the ubuntu path. ---
      - name: Seed full Quran
        run: PSQL=psql bash packages/quran-data/scripts/seed-full-quran-to-db.sh

      # --- Run dependency vulnerability scan (JS) ---
      - name: Dependency vulnerability scan
        run: pnpm audit

      # --- Rust dependency vulnerability scan (cargo-audit). Prebuilt binary for speed; each crate
      #     is scanned from its own dir so its .cargo/audit.toml (documented, reachability-analysed
      #     ignores) is honoured. Fails CI on any NEW advisory. ---
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust dependency vulnerability scan
        run: |
          (cd services/platform-api && cargo audit)
          (cd services/realtime-gateway && cargo audit)

      # --- Software Bill of Materials (CycloneDX, all languages) for supply-chain review (P0.4/P4.4).
      #     Non-blocking (it is an artifact, not a gate — the advisory GATES are pnpm/cargo audit
      #     above); uploaded so a security reviewer (P4.5) has the exact component inventory. ---
      - name: Generate SBOM (CycloneDX)
        run: npx -y @cyclonedx/cdxgen@^11 -o sbom.cdx.json . || echo "::warning::SBOM generation had issues (non-blocking)"
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

      # --- The CODYSTEM gate (same script the agent runs locally) ---
      # This already runs the API parity suite: verify.sh's DB-gated block starts the platform-api
      # binary per configuration group against the postgres service above.
      - run: bash scripts/verify.sh

      # --- PAR4: prove the parity suite's assertions have TEETH ---
      # A ported test that passes proves the assertion was transcribed, not that it is equivalent to
      # the Rust original. This starts the service deliberately broken and requires the NAMED tests
      # to go red; a mutation that changes nothing is a failure.
      #
      # It lives here rather than in verify.sh because its rls-no-role-drop mutation needs a
      # SUPERUSER DATABASE_URL — it works by making `SET LOCAL ROLE` a no-op, which weakens nothing
      # if the connection is already restricted, and the script refuses to report a hollow pass.
      # CI's DATABASE_URL is the postgres container superuser, deterministically.
      - name: API parity suite — mutation (teeth) check
        run: bash scripts/verify-parity-teeth.sh

      # --- Lightweight CI smoke: start platform-api and hit /health ---
      - name: CI smoke test
        run: |
          cargo build --manifest-path services/platform-api/Cargo.toml --release 2>/dev/null
          services/platform-api/target/release/quran-ai-platform-api &
          API_PID=$!
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health || true)
          kill $API_PID 2>/dev/null || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "CI smoke failed: /health returned $HTTP_CODE"
            exit 1
          fi
          echo "CI smoke passed: /health returned 200"
