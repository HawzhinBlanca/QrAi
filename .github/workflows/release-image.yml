# Publish candidate-bound images to durable GHCR repositories.
name: release-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure the lower-case GHCR namespace
        shell: bash
        run: |
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          echo "RELEASE_REGISTRY_NAMESPACE=$namespace" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release image identity
        run: node --test scripts/release-images.test.mjs tests/release/release-artifact-consumption.test.mjs

      - name: Publish full-SHA images and write immutable digests
        env:
          RELEASE_IMAGE_DIGESTS_OUTPUT: ${{ runner.temp }}/image-digests.json
        run: node scripts/release-images.mjs

      - name: Publish the machine-readable digest document
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests.json
          if-no-files-found: error
          retention-days: 90
